[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ct_character"
version = "1.0.0"
description = "A package for analyzing Charge Transfer (CT) excitons and volume-corrected probability densities."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.scripts]
ct-analysis = "ct_character.main:main"

[tool.setuptools.packages.find]
where = ["src"]