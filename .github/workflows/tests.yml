name: Run Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # --- NEW: Tell the robot where the specific project is ---
    defaults:
      run:
        working-directory: ./quant_numerov

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .  # Now '.' refers to /quant_numerov/

    - name: Run Pytest
      run: |
        pytest